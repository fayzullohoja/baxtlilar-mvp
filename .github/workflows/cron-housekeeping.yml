name: Cron · housekeeping

# T-109 / SLA: раз в час вызывает /api/cron/housekeeping, который гоняет:
#  - gc_start_token_uses (чистка истёкших start-token)
#  - admin_sla_reclaim_stale_cases (возврат заброшенных verification-кейсов в очередь)
#  - gc_expire_interests (pending-интересы старше 72ч → expired)
# Раньше роут существовал, но его никто не вызывал — SLA верификации и истечение
# интересов работали только «лениво». Secret CRON_SECRET = Railway env CRON_SECRET.

on:
  schedule:
    - cron: "17 * * * *"   # ежечасно на :17 (смещение от tg-outbox, чтобы не совпадать)
  workflow_dispatch:

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call housekeeping endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${PROD_URL:-https://app.baxtlilar.uz}/api/cron/housekeeping" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $STATUS"
          echo "Body: $BODY"
          # Роут отдаёт 207, когда часть из трёх задач не выполнилась, и 200
          # когда все три прошли. Считать 207 провалом всего крона неверно:
          # именно из-за этого запуски краснели ещё до того, как их выключили,
          # и красный перестал что-либо значить. 207 логируем предупреждением,
          # провал - всё остальное.
          if [ "$STATUS" = "207" ]; then
            echo "::warning::Housekeeping выполнен частично (207): $BODY"
          elif [ "$STATUS" != "200" ]; then
            echo "::error::Housekeeping cron failed with status $STATUS"
            exit 1
          fi
